services:
  fastify_db:
    image: ${PGSQL_VERSION}
    restart: always
    container_name: ${PROJECT_NAME}_db
    tty: true
    volumes:
      - ./dbdata:/var/lib/postgresql/data
    ports:
      - "5232:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    networks:
      - fasify_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastify_adminer:
    image: ${ADMINER_VERSION}
    container_name: ${PROJECT_NAME}_adminer
    restart: always
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - fasify_net 
      

  #TODO: добавить графану

  prometheus:
    image: prom/prometheus:latest
    container_name: ${PROJECT_NAME}_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - fasify_net

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ${PROJECT_NAME}_postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASS}@fastify_db:5432/${DB_NAME}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      fastify_db:
        condition: service_healthy
    networks:
      - fasify_net

  grafana:
    image: grafana/grafana:latest
    container_name: ${PROJECT_NAME}_grafana
    restart: always
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - fasify_net

  loki:
    image: grafana/loki:latest
    container_name: ${PROJECT_NAME}_loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki_data:/loki
      - ./monitoring/loki/config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - fasify_net


networks:
  fasify_net:
    driver: bridge

