name: fastify-prod

services:
  db:
    image: ${PGSQL_VERSION:-postgres:16}
    container_name: ${PROJECT_NAME}_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ./prod_data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  adminer:
    image: ${ADMINER_VERSION:-adminer:5.4.2}
    container_name: ${PROJECT_NAME}_adminer_prod
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-795}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  redis:
    image: redis:latest
    container_name: ${PROJECT_NAME}_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASS}
    networks:
      - app_net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PROJECT_NAME}_app:prod
    container_name: ${PROJECT_NAME}_migrate
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}?schema=public
    command: ["bunx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PROJECT_NAME}_app:prod
    container_name: ${PROJECT_NAME}_app
    restart: always
    env_file:
      - .env.prod
    environment:
      NODE_ENV: prod
      APP_PORT: 3000
      DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}?schema=public
      REDIS_HOST: redis
      LOKI_HOST: http://loki:3100
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app_net

  nginx:
    image: nginx:1.25-alpine
    container_name: ${PROJECT_NAME}_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./prod_data/nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - app_net

  prometheus:
    image: prom/prometheus:latest
    container_name: ${PROJECT_NAME}_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prod_data/prometheus:/prometheus
    networks:
      - app_net

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ${PROJECT_NAME}_postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  grafana:
    image: grafana/grafana:latest
    container_name: ${PROJECT_NAME}_grafana
    restart: always
    volumes:
      - ./prod_data/grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    networks:
      - app_net

  loki:
    image: grafana/loki:latest
    container_name: ${PROJECT_NAME}_loki
    restart: always
    volumes:
      - ./prod_data/loki:/loki
      - ./monitoring/loki/config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_net

  alloy:
    image: grafana/alloy:latest
    container_name: ${PROJECT_NAME}_alloy
    restart: always
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./prod_data/nginx_logs:/var/log/nginx:ro
      - ./prod_data/alloy:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
